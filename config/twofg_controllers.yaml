$(var ns):
  controller_manager:
    ros__parameters:
      update_rate: 50

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      finger_width_controller:
        type: position_controllers/JointGroupPositionController

  finger_width_controller:
    ros__parameters:
      joints:
        - $(var prefix)finger_width
      # 2FG-specific parameters from documentation
      state_publish_rate: 50.0
      action_monitor_rate: 10.0
      allow_partial_joints_goal: true
      constraints:
        goal_time: 5.0
        stopped_velocity_tolerance: 0.01
        finger_width:
          goal: 0.001
          trajectory: 0.001
      # 2FG7 specific parameters
      max_width: 0.07     # 70mm for 2FG7
      min_width: 0.035    # 35mm for 2FG7
      default_force: 35.0 # 50% of 70N max force
      default_speed: 50.0 # 50% speed (10-100% valid range)
      grip_type: "external" # external or internal