$(var ns):
  controller_manager:
    ros__parameters:
      update_rate: 50

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      gripper_channel_a_controller:
        type: position_controllers/GripperActionController

      gripper_channel_b_controller:
        type: position_controllers/GripperActionController

      vacuum_group_controller:
        type: position_controllers/JointGroupPositionController

  gripper_channel_a_controller:
    ros__parameters:
      joint: $(var prefix)vacuum_channel_a
      action_monitor_rate: 20.0
      goal_tolerance: 0.05
      max_effort: 80.0
      stall_velocity_threshold: 0.001
      stall_timeout: 1.0

  gripper_channel_b_controller:
    ros__parameters:
      joint: $(var prefix)vacuum_channel_b
      action_monitor_rate: 20.0
      goal_tolerance: 0.05
      max_effort: 80.0
      stall_velocity_threshold: 0.001
      stall_timeout: 1.0

  vacuum_group_controller:
    ros__parameters:
      joints:
        - $(var prefix)vacuum_channel_a
        - $(var prefix)vacuum_channel_b
